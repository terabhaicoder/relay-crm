name: relay-crm

services:
  api:
    build: ./backend
    environment:
      DATABASE_URL: sqlite:////data/relay.db
      ENVIRONMENT: development
      LOG_LEVEL: INFO
      CORS_ORIGINS: '["http://localhost:${FRONTEND_PORT:-3007}","http://127.0.0.1:${FRONTEND_PORT:-3007}"]'
      DEMO_SEED: ${DEMO_SEED:-false}
      DEMO_EMAIL: ${DEMO_EMAIL:-owner@demo.local}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-}
    volumes:
      - crm_data:/data
    ports:
      - "127.0.0.1:${API_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health/ready', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 12
    init: true
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      BACKEND_URL: http://api:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3007}:3000"
    depends_on:
      api:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  crm_data:
