name: CRM verification
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.7.19'
      - run: uv sync
        working-directory: backend
      - run: uv run ruff check .
        working-directory: backend
      - run: uv run ruff format --check .
        working-directory: backend
      - run: uv run mypy app
        working-directory: backend
      - run: uv run pytest -m 'not integration'
        working-directory: backend
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify generated API contracts
        run: |
          PYTHONPATH=backend backend/.venv/bin/python backend/scripts/export_openapi.py
          node frontend/scripts/generate-api.mjs
          git diff --exit-code -- frontend/openapi.json frontend/src/lib/api/schema.ts
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - run: npm run lint && npm run typecheck && npm run test:proxy && npm run build
        working-directory: frontend
  journeys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: pip install -r backend/requirements-local.txt
      - run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python3 scripts/dev.py > /tmp/relay-crm.log 2>&1 &
      - name: Wait for the real API and web app
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8010/api/v1/health/ready && curl -fsS http://127.0.0.1:3007/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/relay-crm.log
          exit 1
      - run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3007
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: journey-traces
          path: frontend/test-results

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate production definition and gateway
        run: |
          docker compose --env-file deploy/production.env.example -f docker-compose.production.yml config --quiet
          docker run --rm -e DOMAIN=crm.example.com -e TLS_EMAIL=admin@example.com -v "$PWD/deploy/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2.11.2-alpine caddy validate --config /etc/caddy/Caddyfile
      - name: Build and start real containers on isolated CI volumes
        run: docker compose --env-file .env.example up -d --build --wait
      - name: Exercise HTTP journey through built frontend
        run: python3 scripts/smoke.py --base-url http://127.0.0.1:3007 --allow-create-workspace
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install browser acceptance runner
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser journeys against production frontend build
        run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3007
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: container-journey-traces
          path: frontend/test-results
      - name: Container diagnostics
        if: failure()
        run: docker compose --env-file .env.example logs --no-color --tail 100
      - name: Remove disposable CI containers and volumes
        if: always()
        run: docker compose --env-file .env.example down -v
